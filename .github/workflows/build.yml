name: Build Can I Start APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "28"
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake autopoint libtool libtool-bin libltdl-dev m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install compatible Python build toolchain
        run: |
          python --version
          python -m pip install --upgrade "pip<24.2" "setuptools<70" wheel
          python -m pip install --upgrade "buildozer==1.5.0" "cython==0.29.36"

      - name: Clean old build cache
        run: |
          rm -rf .buildozer

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Can-I-Start-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
